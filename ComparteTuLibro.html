<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Subir Libro o Cómic</title>
    <link rel="stylesheet" href="estilo.css" />
  </head>
  <body>
    <header>
       <div class="logo">
            <img src="OIP__5_-removebg-preview.png">
        </div>
    </header>
    <h1>Comparte tu Libro o Cómic</h1>
    <form action="galeria.html" method="POST" enctype="multipart/form-data">
      <label for="titulo">Título:</label>
      <input type="text" id="titulo" name="titulo" required />

      <label for="/subir">Descripción:</label>
      <input type="text" id="descripcion" name="descripcion" required>

      <label for="/subir">Autor:</label>
      <input type="text" id="autor" name="autor" required>

      <label for="/subir">Introducción:</label>
      <input type="text" id="introduccion" name="introduccion" required>

      <label for="archivo">Archivo (PDF):</label>
      <input type="file" id="archivo" name="archivo" accept=".pdf" required />

      <button type="submit">Subir</button>
    </form>

    <a href="galeria.html">Ver Galería</a>
  </body>
</html>
