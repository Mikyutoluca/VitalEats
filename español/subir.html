<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Sube tu Libro</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="encabezado">
    <h1>📘 Plataforma de Libros Compartidos</h1>
  </header>

  <main class="formulario">
    <h2>Sube tu libro</h2>
    <form>
      <label for="titulo">Título del libro:</label>
      <input type="text" id="titulo" name="titulo" required />

      <label for="autor">Autor:</label>
      <input type="text" id="autor" name="autor" required />

      <label for="genero">Genero:</label>
      <input type="text" id="genero" name="genero" required />

      <label for="descripcion">Descripción:</label>
      <textarea id="descripcion" name="descripcion" rows="4"></textarea>

      <label for="archivo">Archivo PDF:</label>
      <input type="file" id="archivo" name="archivo" accept=".pdf" required />

      <button type="submit">📤 Subir libro</button>
    </form>
  </main>

  <footer class="pie">© 2025 Biblioteca Abierta</footer>
</body>
</html>
